name: publish release

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'release' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: ./.github/actions/install-knope
      - name: configure git identity for the release tag
        run: |
          git config user.name "garita-release-bot"
          git config user.email "garita-release-bot@users.noreply.github.com"
      - name: tag and create the GitHub release
        run: knope release --verbose
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: resolve the tag knope created
        id: version
        run: |
          set -euo pipefail
          version=$(grep -m1 -E '^version = "' rust/Cargo.toml | sed 's/^version = "\(.*\)"$/\1/')
          if [ -z "$version" ]; then
            echo "::error::could not read the released version from rust/Cargo.toml"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "resolved tag: v$version"

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.tag }}
      - name: install the pinned toolchain and target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show
          rustup target add "$TARGET"
      - name: build
        env:
          TARGET: ${{ matrix.target }}
          MACOSX_DEPLOYMENT_TARGET: ${{ contains(matrix.target, 'apple-darwin') && '11.0' || '' }}
        run: cargo build --release --locked --target "$TARGET" -p garita-cli
      - name: package
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          name="garita-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/garita" "dist/$name/"
          cp ../LICENSE ../README.md "dist/$name/"
          got=$("dist/$name/garita" --version)
          if [ "$got" != "garita ${TAG#v}" ]; then
            echo "::error::the built binary reports '$got', expected 'garita ${TAG#v}'"
            exit 1
          fi
          tar -czf "dist/$name.tar.gz" -C dist "$name"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: rust/dist/garita-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: garita-${{ matrix.target }}
          path: rust/dist/garita-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  upload:
    needs: [release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: attach the archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/*.tar.gz --clobber --repo "$REPO"
      - name: the release carries exactly the expected archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          got=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | sort)
          want=$(printf '%s\n' garita-aarch64-apple-darwin.tar.gz garita-x86_64-unknown-linux-gnu.tar.gz)
          if [ "$got" != "$want" ]; then
            echo "::error::$TAG has the wrong assets"
            printf 'expected:\n%s\nfound:\n%s\n' "$want" "$got"
            exit 1
          fi
          echo "$TAG carries both archives"
