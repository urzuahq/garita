name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# Only new commits cancel a run. A label, or a second event on the same commit, waits its turn, so
# the run for the latest event finishes last and no cancelled run leaves a failed `ci` on the commit
# the ruleset is judging.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  records:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: urzuahq/urzua/.github/actions/urzua-gate@e52818ccf9ea03035ca7858d547c9df36ee6bfff # v0.4.14
        with:
          version: v0.4.14
          base-ref: ${{ github.base_ref }}

  changeset:
    name: changeset required
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: does this PR touch a release path?
        id: scope
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF"
          changed=$(git diff --name-only "origin/$BASE_REF"...HEAD)
          while IFS= read -r prefix; do
            case "$prefix" in ''|\#*) continue ;; esac
            if printf '%s\n' "$changed" | grep -q "^$(printf '%s' "$prefix" | sed 's/[][\.*^$/]/\\&/g')"; then
              echo "touches $prefix -- a changelog entry may be needed"
              echo "affects=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < .github/release-paths
          echo "no release path changed -- no changeset needed"
      # Read live: the event payload is a snapshot from when the event fired.
      - name: check for the no-changeset opt-out
        if: steps.scope.outputs.affects == 'true'
        id: optout
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels \
               --jq '.labels[].name' | grep -qx 'no-changeset'; then
            echo "no-changeset label present"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # A skipped step leaves its output empty, which is not 'true', so both
      # conditions are needed.
      - name: verify this PR adds a .changeset fragment
        if: steps.scope.outputs.affects == 'true' && steps.optout.outputs.skip != 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF"
          added=$(git diff --name-only --diff-filter=A "origin/$BASE_REF"...HEAD -- '.changeset/*.md' || true)
          if [ -z "$added" ]; then
            echo "no .changeset/*.md fragment added -- run 'knope document-change', or label this PR 'no-changeset' if there is nothing to release"
            exit 1
          fi
          echo "found: $added"

  release-invariants:
    name: release invariants
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The guard compares the manifest version with the newest tag, so it
      # needs full history and tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: check the invariants on this ref
        run: |
          .github/scripts/release-invariants.sh \
            .changeset rust/Cargo.toml "$(git tag --sort=-v:refname | head -1)"

  install-script:
    name: install script tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make install-script-test

  # The one required check. A failure, a cancellation and a skip all fail it;
  # `changeset` exists on pull requests alone, so it is the only job that may skip.
  ci:
    name: ci
    needs: [checks, records, changeset, release-invariants, install-script]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: fail unless every required job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          ALLOW_SKIPPED: ${{ github.event_name != 'pull_request' && 'changeset' || '' }}
        run: .github/scripts/ci-gate.sh --allow-skipped "$ALLOW_SKIPPED"
