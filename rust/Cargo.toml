[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/urzuahq/garita"
publish = false

[workspace.dependencies]
garita-core = { path = "crates/garita-core" }
garita-io = { path = "crates/garita-io" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
clap = { version = "4", features = ["derive"] }
ulid = "3.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
too_many_lines = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
