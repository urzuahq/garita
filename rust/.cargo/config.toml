# Cargo exports these to every test binary and to everything the tests spawn, so no
# fixture git command reads the machine's global or system git configuration.
[env]
GIT_CONFIG_GLOBAL = { value = "/dev/null", force = true }
GIT_CONFIG_NOSYSTEM = { value = "1", force = true }
GIT_AUTHOR_NAME = { value = "garita test", force = true }
GIT_AUTHOR_EMAIL = { value = "test@example.com", force = true }
GIT_COMMITTER_NAME = { value = "garita test", force = true }
GIT_COMMITTER_EMAIL = { value = "test@example.com", force = true }
